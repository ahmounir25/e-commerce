name: CI PIPELINE

on:
  push:
    branches: [ "dev","master" ]

  pull_request:
    branches: [ "dev","master" ]


jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecommerce
          MYSQL_USER: ecommerce_user
          MYSQL_PASSWORD: ecommerce_pass
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      LIFE_TIME_ACCESS: ${{secrets.LIFE_TIME_ACCESS}}
      LIFE_TIME_REFRESH: ${{secrets.LIFE_TIME_REFRESH}}

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
                ${{ runner.os }}-maven-

      - name: Wait for MySQL
        uses: jakejarvis/wait-action@v0.1.1
        with:
          time: '60s'

      - name: run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/ecommerce
          MYSQL_USER: ecommerce_user
          MYSQL_PASSWORD: ecommerce_pass

        run: mvn -B clean test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Package app
        run: mvn  package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: project version
        id: get_version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: build image
        run: docker build -t ${{secrets.DOCKER_HUB_USERNAME}}/ecommerce:${env.VERSION} .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/ecommerce:${env.VERSION}


